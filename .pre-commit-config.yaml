# pyright and pip-audit run in the test job of CI (and locally from .venv), since
# they need the installed package with its dependencies
repos:

  # Generic, TOML, and YAML checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-toml
      - id: check-yaml

  # Ruff formatter & linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        name: ruff (linter)
      - id: ruff-format
        name: ruff (formatter)

  # MyST Markdown formatter
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: mdformat (MyST)
        additional_dependencies:
          - mdformat-myst
